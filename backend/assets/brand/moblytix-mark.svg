<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Moblytix">
  <defs>
    <linearGradient id="mtx-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="mtx-line" x1="16" y1="96" x2="112" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#mtx-bg)"/>

  <!-- trilha (rota) que tambem le como tendencia analitica ascendente -->
  <path d="M18 88 L40 52 L58 72 L82 36 L110 50"
        stroke="url(#mtx-line)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- pontos de dados / GPS pings ao longo da rota -->
  <circle cx="18" cy="88" r="5" fill="#FFFFFF" opacity="0.55"/>
  <circle cx="40" cy="52" r="5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="58" cy="72" r="5" fill="#FFFFFF" opacity="0.75"/>
  <circle cx="110" cy="50" r="5" fill="#FFFFFF" opacity="0.75"/>

  <!-- pino de localizacao no ponto mais alto -->
  <path d="M82 14c-8.28 0-15 6.72-15 15 0 11.25 15 25 15 25s15-13.75 15-25c0-8.28-6.72-15-15-15z"
        fill="#FFFFFF"/>
  <circle cx="82" cy="29" r="6" fill="#0E1B4D"/>
</svg>
