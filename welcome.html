<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bem-vindo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 60px 40px;
      max-width: 600px;
    }

    .icon {
      font-size: 72px;
      margin-bottom: 24px;
      display: block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #e94560, #0f3460, #533483);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 18px;
      color: #a0aec0;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 14px 36px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: #fff;
      text-decoration: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(233, 69, 96, 0.6);
    }

    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, #e94560, #533483);
      margin: 32px auto;
      border-radius: 2px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 48px;
    }

    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .feature-icon {
      font-size: 28px;
    }

    .feature-label {
      font-size: 13px;
      color: #718096;
    }
  </style>
</head>
<body>
  <div class="container">
    <span class="icon">👋</span>
    <h1>Bem-vindo!</h1>
    <p class="subtitle">
      Estamos felizes em ter você aqui.<br>
      Explore, descubra e aproveite tudo que preparamos para você.
    </p>
    <div class="divider"></div>
    <button class="btn">Começar agora</button>

    <div class="features">
      <div class="feature">
        <span class="feature-icon">🚀</span>
        <span class="feature-label">Rápido</span>
      </div>
      <div class="feature">
        <span class="feature-icon">🔒</span>
        <span class="feature-label">Seguro</span>
      </div>
      <div class="feature">
        <span class="feature-icon">✨</span>
        <span class="feature-label">Moderno</span>
      </div>
    </div>
  </div>
</body>
</html>
